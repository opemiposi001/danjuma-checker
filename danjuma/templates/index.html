<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danjuma - Email Security Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div class="navbar-content">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <span>Danjuma Scanner</span>
            </div>
            <p class="tagline">Advanced Email Attachment Security</p>
        </div>
    </div>

    <div class="container">
        <div class="hero-section">
            <h1>Email Security Shield</h1>
            <p>Protect your inbox from malicious attachments with AI-powered scanning</p>
        </div>

        <div class="dashboard">
            <!-- Register Card -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-user-plus"></i>
                    <h2>Enable Protection</h2>
                </div>
                <form id="registerForm" class="form-group">
                    <input type="email" id="registerEmail" placeholder="Enter your email address" required>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-shield-alt"></i> Enable Scanning
                    </button>
                </form>
            </div>

            <!-- Gmail OAuth Card -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-envelope-open-text"></i>
                    <h2>Gmail Authorization</h2>
                </div>
                <form id="gmailAuthUrlForm" class="form-group">
                    <input type="email" id="gmailAuthUrlEmail" placeholder="Enter your Gmail address" required>
                    <button type="submit" class="btn btn-secondary">
                        <i class="fas fa-arrow-right"></i> Get Gmail Auth URL
                    </button>
                </form>
                <form id="gmailAuthorizeForm" class="form-group">
                    <input type="email" id="gmailAuthorizeEmail" placeholder="Enter your Gmail address" required>
                    <input type="text" id="gmailAuthCode" placeholder="Paste authorization code here" required>
                    <button type="submit" class="btn btn-secondary">
                        <i class="fas fa-check-circle"></i> Complete Gmail Authorization
                    </button>
                </form>
            </div>

            <!-- Status Card -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-heartbeat"></i>
                    <h2>Protection Status</h2>
                </div>
                <form id="statusForm" class="form-group">
                    <input type="email" id="statusEmail" placeholder="Enter your email address" required>
                    <button type="submit" class="btn btn-info">
                        <i class="fas fa-check-circle"></i> Check Status
                    </button>
                </form>
            </div>

            <!-- Scans History Card -->
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-history"></i>
                    <h2>Scan History</h2>
                </div>
                <form id="scansForm" class="form-group">
                    <input type="email" id="scansEmail" placeholder="Enter your email address" required>
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-list"></i> View History
                    </button>
                </form>
            </div>

            <!-- Unregister Card -->
            <div class="card">
                <div class="card-header danger">
                    <i class="fas fa-user-lock"></i>
                    <h2>Disable Protection</h2>
                </div>
                <form id="unregisterForm" class="form-group">
                    <input type="email" id="unregisterEmail" placeholder="Enter your email address" required>
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-times-circle"></i> Disable
                    </button>
                </form>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" class="results-container"></div>
    </div>

    <footer>
        <p>&copy; 2026 Danjuma Security. Powered by VirusTotal API.</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
